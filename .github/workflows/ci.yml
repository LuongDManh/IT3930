name: CI – Build & Test

on:
  push:
    branches: ["**"]          # run on every branch push
  pull_request:
    branches: ["**"]          # run on every PR

jobs:
  test:
    name: Run Unit Tests (Java 21 / Maven)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up JDK 21 ────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"        # Eclipse Temurin (formerly AdoptOpenJDK)
          cache: maven                   # cache ~/.m2 between runs for speed

      # ── 3. Make Maven wrapper executable ────────────────────────────────
      - name: Make mvnw executable
        run: chmod +x mvnw

      # ── 4. Run tests ─────────────────────────────────────────────────────
      # The test profile (application-test.properties) excludes DataSource,
      # JPA, and Mail auto-configuration so no real database or SMTP server
      # is needed.  All tests use Mockito and run entirely in-process.
      - name: Run tests
        run: ./mvnw test -Dspring.profiles.active=test --no-transfer-progress

      # ── 5. Upload Surefire test report ──────────────────────────────────
      - name: Upload test results
        if: always()           # upload even when tests fail so you can inspect
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14
