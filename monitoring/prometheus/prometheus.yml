global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:

  # ── Prometheus self-monitoring ─────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── Host metrics — Node Exporter on ALL 3 nodes ────────────────
  # `tasks.node-exporter` is Docker Swarm's internal DNS that
  # resolves to each individual task IP (not the VIP).
  # This gives Prometheus 3 separate targets — one per node.
  - job_name: "node_exporter"
    dns_sd_configs:
      - names:
          - "tasks.node-exporter"
        type: A
        port: 9100
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # ── Container metrics — cAdvisor on ALL 3 nodes ───────────────
  # `tasks.cadvisor` resolves to each individual cAdvisor task IP.
  # This gives Prometheus 3 separate targets — one per node.
  - job_name: "cadvisor"
    dns_sd_configs:
      - names:
          - "tasks.cadvisor"
        type: A
        port: 8080
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
